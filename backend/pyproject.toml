[project]
name = "dweb-backend"
version = "0.1.0"
description = "웹툰 작가 개인 사이트 - 백엔드"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "sqlmodel>=0.0.38",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.14.1",
    "structlog>=25.5.0",
    "sentry-sdk[fastapi]>=2.61.0",
    "bcrypt>=5.0.0",
    "PyJWT>=2.13.0",
    "httpx>=0.28.1",
    "email-validator>=2.3.0",
    "limits>=5.8.0",
    "google-auth>=2.54.0",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
