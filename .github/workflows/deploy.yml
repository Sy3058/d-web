name: Deploy environment

on:
  workflow_call:
    inputs:
      deployment_environment:
        required: true
        type: string
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SSH_KNOWN_HOSTS:
        required: true
      CF_ACCESS_CLIENT_ID:
        required: true
      CF_ACCESS_CLIENT_SECRET:
        required: true

permissions:
  contents: read
  packages: write

# Do not interrupt an SSH command while it is applying a DB migration.
concurrency:
  group: deployment-${{ inputs.deployment_environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      ((inputs.deployment_environment == 'staging' && github.ref == 'refs/heads/develop') ||
       (inputs.deployment_environment == 'production' && github.ref == 'refs/heads/release'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.deployment_environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate deployment identity and public API host
        id: target
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.deployment_environment }}
          API_HOST: ${{ vars.API_HOST }}
        run: bash scripts/prepare-deployment.sh

      - name: Install pinned Cloudflare SSH client
        run: |
          curl --fail --location --silent --show-error https://github.com/cloudflare/cloudflared/releases/download/2026.11.2/cloudflared-linux-amd64 -o "$RUNNER_TEMP/cloudflared"
          printf '%s  %s\n' '56f13335143ec0e22772963290683a84a04114a35ec64cbc794a4d39ff9bb8cf' "$RUNNER_TEMP/cloudflared" | sha256sum --check --status
          chmod 700 "$RUNNER_TEMP/cloudflared"

      - name: Validate deployment access configuration
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          [[ $SSH_HOST =~ ^[A-Za-z0-9.-]+$ && $SSH_USER =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ $SSH_PORT =~ ^[0-9]{1,5}$ && 10#$SSH_PORT -ge 1 && 10#$SSH_PORT -le 65535 ]]
          [[ -n $SSH_KNOWN_HOSTS && -n $SSH_PRIVATE_KEY && -n $CF_ACCESS_CLIENT_ID && -n $CF_ACCESS_CLIENT_SECRET ]]

      - name: Sign in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish commit images
        env:
          IMAGE_PREFIX: ${{ steps.target.outputs.image_prefix }}
          DEPLOY_SHA: ${{ steps.target.outputs.deployment_sha }}
          PUBLIC_API_URL: ${{ steps.target.outputs.api_url }}
        run: |
          docker build --label "org.opencontainers.image.revision=$DEPLOY_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -f backend/Dockerfile -t "$IMAGE_PREFIX/api:$DEPLOY_SHA" backend
          docker push "$IMAGE_PREFIX/api:$DEPLOY_SHA"
          docker build --label "org.opencontainers.image.revision=$DEPLOY_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "io.dweb.api-url=$PUBLIC_API_URL" --build-arg "PUBLIC_API_URL=$PUBLIC_API_URL" -f frontend/Dockerfile -t "$IMAGE_PREFIX/frontend:$DEPLOY_SHA" .
          docker push "$IMAGE_PREFIX/frontend:$DEPLOY_SHA"
          docker build --label "org.opencontainers.image.revision=$DEPLOY_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "io.dweb.api-url=$PUBLIC_API_URL" --build-arg "VITE_API_URL=$PUBLIC_API_URL" -f admin/Dockerfile -t "$IMAGE_PREFIX/admin:$DEPLOY_SHA" .
          docker push "$IMAGE_PREFIX/admin:$DEPLOY_SHA"

      - name: Deploy the verified commit over SSH
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.deployment_sha }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/dweb-deploy-key"
          hosts_file="$RUNNER_TEMP/dweb-known-hosts"
          trap 'rm -f -- "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" -o "ProxyCommand=$GITHUB_WORKSPACE/scripts/ssh-cloudflare-proxy.sh %h" "$SSH_USER@$SSH_HOST" "deploy $DEPLOY_SHA"

      - name: Sign out of GHCR
        if: always()
        run: docker logout ghcr.io
