name: CI

# main 대상 PR과 main 직접 푸시에서 백엔드·프론트엔드 검사를 돌린다.
# (CD/배포는 범위 밖 - 이 워크플로는 검증만 한다.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치에서 새 푸시가 오면 이전 실행을 취소(Actions 분 절약).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 기본 GITHUB_TOKEN 권한을 읽기 전용으로 좁힌다(이 CI는 쓰기 동작이 없다).
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15      # DB race·행(hang) 시 무한 점유 방지
    defaults:
      run:
        working-directory: backend

    services:
      # 통합 테스트용 Postgres. conftest.py가 SQLModel.metadata.create_all로
      # 스키마를 직접 만들므로 alembic 없이 '빈 DB'만 있으면 된다.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dweb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # conftest는 TEST_DATABASE_URL을 우선 사용(없으면 DATABASE_URL로 폴백)하므로
      # 로컬과 같은 코드패스를 타도록 명시한다. DATABASE_URL은 Settings()가 import 시
      # 필수로 요구해 함께 채운다(둘 다 같은 테스트 DB를 가리킴).
      # 아래 시크릿류는 테스트 전용 더미값(실제 비밀 아님, 운영 시크릿과 무관).
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dweb_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dweb_test
      JWT_SECRET: ci-test-secret
      PASSWORD_PEPPER: ci-test-password-pepper
      TOKEN_PEPPER: ci-test-token-pepper
      # TOTP_ENCRYPTION_KEY만은 임의 문자열이 아니라 유효한 Fernet 키(32B url-safe base64)여야
      # 한다 - 아니면 lib/totp의 Fernet() 생성이 import 시 raise한다. 테스트 전용 던져버릴 키.
      TOTP_ENCRYPTION_KEY: DPoSsxZaQsTn01cvXRYfFHGgk-VDTwqIpia3lVn41Ew=
      APP_BASE_URL: http://localhost:4321
      ADMIN_BASE_URL: http://localhost:5173
      API_BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Python (requires-python in pyproject)
        run: uv python install

      - name: Install dependencies (locked)
        run: uv sync --locked

      # 범위는 be.md PR 템플릿 게이트와 일치시킨다(src/ lint, src/+tests/ format).
      # migrations/는 alembic 자동생성 + DB 적용 + forward-only라 의도적으로 제외.
      - name: Ruff lint
        run: uv run ruff check src/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15      # 설치·빌드 행(hang) 시 무한 점유 방지

    steps:
      - uses: actions/checkout@v6

      # pnpm을 setup-node보다 먼저 설치한다 - setup-node의 cache: pnpm이
      # 'pnpm store path'를 실행하려면 pnpm이 이미 PATH에 있어야 한다.
      # packageManager 필드가 없어 version 명시(로컬 pnpm 10과 일치, lockfile 9.0).
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Node (frontend engines >=24)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      # 워크스페이스 루트에서 설치(shared는 TS 소스 직접 export라 별도 빌드 불요).
      # frozen-lockfile: lockfile과 package.json 불일치 시 실패 = 재현성 게이트.
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # 게이트 3종은 frontend PR 템플릿 검증 체크와 일치.
      # Sentry는 auth token 미설정 시 경고만 내고 릴리스/소스맵 업로드를 건너뜀(실측).
      - name: Astro check
        run: pnpm --filter frontend astro check

      - name: Build
        run: pnpm --filter frontend build

      - name: Vitest
        run: pnpm --filter frontend test
