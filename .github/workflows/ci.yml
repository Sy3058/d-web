name: CI

# 통합 브랜치 대상 PR과 직접 푸시에서 브랜치 정책과 앱 검사를 돌린다.
# 전체 검증 성공 후 활성화된 환경만 deploy.yml로 배포한다. PR은 배포하지 않는다.
on:
  workflow_dispatch:
  push:
    branches: [main, develop, release]
  pull_request:
    branches: [main, develop, release]
    # base를 develop에서 release 등으로 바꾼 PR도 정책을 다시 검사한다.
    types: [opened, synchronize, reopened, edited]

# PR의 이전 검사는 취소하지만 push 실행은 배포·마이그레이션 중단을 막기 위해 완료시킨다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 기본 토큰은 읽기 전용이다. 별도 이미지 발행 workflow만 packages:write를 사용한다.
permissions:
  contents: read

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test branch policy
        run: sh scripts/test-branch-policy.sh

      - name: Test deployment trust boundaries
        run: |
          python3 -m unittest discover -s scripts -p "test_cd_*.py"
          python3 -m unittest discover -s scripts -p "test_deployment.py"

      - name: Validate pull request target
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_TARGET_REPO: ${{ github.repository }}
        run: ./scripts/check-pr-target.sh "$PR_BASE" "$PR_HEAD" "$PR_SOURCE_REPO" "$PR_TARGET_REPO"

  backend:
    needs: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15      # DB race·행(hang) 시 무한 점유 방지
    defaults:
      run:
        working-directory: backend

    services:
      # 통합 테스트용 Postgres. conftest.py가 SQLModel.metadata.create_all로
      # 스키마를 직접 만들므로 alembic 없이 '빈 DB'만 있으면 된다.
      postgres:
        image: postgres:16.16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dweb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # conftest는 TEST_DATABASE_URL을 우선 사용(없으면 DATABASE_URL로 폴백)하므로
      # 로컬과 같은 코드패스를 타도록 명시한다. DATABASE_URL은 Settings()가 import 시
      # 필수로 요구해 함께 채운다(둘 다 같은 테스트 DB를 가리킴).
      # 아래 시크릿류는 테스트 전용 더미값(실제 비밀 아님, 운영 시크릿과 무관).
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dweb_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dweb_test
      JWT_SECRET: ci-test-secret
      PASSWORD_PEPPER: ci-test-password-pepper
      TOKEN_PEPPER: ci-test-token-pepper
      # TOTP_ENCRYPTION_KEY만은 임의 문자열이 아니라 유효한 Fernet 키(32B url-safe base64)여야
      # 한다 - 아니면 lib/totp의 Fernet() 생성이 import 시 raise한다. 테스트 전용 던져버릴 키.
      TOTP_ENCRYPTION_KEY: DPoSsxZaQsTn01cvXRYfFHGgk-VDTwqIpia3lVn41Ew=
      APP_BASE_URL: http://localhost:4321
      ADMIN_BASE_URL: http://localhost:5173
      API_BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install Python (requires-python in pyproject)
        run: uv python install

      - name: Install dependencies (locked)
        run: uv sync --locked

      # 범위는 be.md PR 템플릿 게이트와 일치시킨다(src/ lint, src/+tests/ format).
      # migrations/는 alembic 자동생성 + DB 적용 + forward-only라 의도적으로 제외.
      - name: Ruff lint
        run: uv run ruff check src/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Pytest
        run: uv run pytest

  frontend:
    needs: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15      # 설치·빌드 행(hang) 시 무한 점유 방지

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # pnpm을 setup-node보다 먼저 설치한다 - setup-node의 cache: pnpm이
      # 'pnpm store path'를 실행하려면 pnpm이 이미 PATH에 있어야 한다.
      # packageManager 필드가 없어 version 명시(로컬 pnpm 10과 일치, lockfile 9.0).
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10

      - name: Install Node (frontend engines >=24.22.3)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm

      # 워크스페이스 루트에서 설치(shared는 TS 소스 직접 export라 별도 빌드 불요).
      # frozen-lockfile: lockfile과 package.json 불일치 시 실패 = 재현성 게이트.
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # 게이트 4종은 frontend PR 템플릿 검증 체크와 일치.
      # Sentry는 auth token 미설정 시 경고만 내고 릴리스/소스맵 업로드를 건너뜀(실측).
      - name: ESLint
        run: pnpm --filter frontend lint

      - name: Astro check
        run: pnpm --filter frontend astro check

      - name: Build
        run: pnpm --filter frontend build

      - name: Vitest
        run: pnpm --filter frontend test

      - name: Viewer SSR HTTP checks
        run: pnpm --filter frontend test:ssr

  admin:
    needs: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15      # 설치·빌드 행(hang) 시 무한 점유 방지

    # 셋업 구성·순서·버전 근거는 frontend job 주석 참조(동일 구성).
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm --filter admin lint

      - name: Build (tsc + vite)
        run: pnpm --filter admin build

      - name: Vitest
        run: pnpm --filter admin test

  publish:
    needs: [branch-policy, backend, frontend, admin]
    # Repository variables are opt-in switches. Defaults are disabled until server bootstrap is complete.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      ((github.ref == 'refs/heads/develop' && vars.STAGING_DEPLOY_ENABLED == 'true') ||
       (github.ref == 'refs/heads/release' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      deployment_environment: ${{ github.ref == 'refs/heads/develop' && 'staging' || 'production' }}
      api_host: ${{ vars[github.ref == 'refs/heads/develop' && 'STAGING_API_HOST' || 'PRODUCTION_API_HOST'] }}

  deploy:
    needs: publish
    # Repository variables are opt-in switches. Defaults are disabled until server bootstrap is complete.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      ((github.ref == 'refs/heads/develop' && vars.STAGING_DEPLOY_ENABLED == 'true') ||
       (github.ref == 'refs/heads/release' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'))
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      deployment_environment: ${{ github.ref == 'refs/heads/develop' && 'staging' || 'production' }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
