name: d-web
# 프로젝트명을 고정한다 - 없으면 디렉터리명이 프로젝트명이 돼서, git worktree로 분리된
# 두 디렉터리(d-web, d-web-m2)가 docker compose up을 각자 돌릴 때 서로 다른 프로젝트로
# 인식돼 별도의 빈 볼륨 컨테이너가 생긴다(2026-07-20 실제 사고 - d-web-m2-postgres-1이
# 호스트 포트 5432를 가로채 진짜 dev 데이터가 안 보이게 됨). d-web으로 고정해 기존
# 컨테이너 이름(d-web-postgres-1 등)·볼륨(d-web_postgres_data)과 그대로 일치시킨다.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dweb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 로컬 호스트에서만 접근 (외부 노출 금지). VPS 프로덕션은 포트 노출 자체 제거 예정 (M0 그룹 D 메모)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # compose 내에서는 postgres 서비스 호스트명으로 오버라이드
      # (backend/.env 의 DATABASE_URL=...@localhost:... 를 덮어씀)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-dweb}
      APP_BASE_URL: http://localhost
      ADMIN_BASE_URL: http://admin.localhost
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 로컬 호스트에서만 직접 접근 (Caddy 우회 경로). VPS 프로덕션은 포트 노출 제거 예정 (M0 그룹 D 메모)
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # PUBLIC_API_URL은 브라우저용 빌드 값, 이 주소는 SSR Node의 compose 내부 통신용이다.
      API_INTERNAL_URL: http://api:8000
    healthcheck:
      # SSR 홈은 API 상태에 따라 실패할 수 있어 readiness와 콘텐츠 의존성을 분리한다.
      # 정적 favicon 응답으로 Astro Node 프로세스와 정적 자산 서빙만 확인한다.
      test: ["CMD", "node", "-e", "fetch('http://localhost:4321/favicon.svg').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
